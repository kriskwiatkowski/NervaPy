name: Publish to PyPI

on:
    release:
        types: [ published ]
    workflow_dispatch: {}

jobs:
    publish:
        runs-on: ubuntu-latest
        # workflow_dispatch (manual "test release") goes to TestPyPI under its
        # own environment, so it can never pick up the real PyPI trusted
        # publisher that's bound to the "release" environment.
        environment: ${{ github.event_name == 'workflow_dispatch' && 'testpypi' || 'release' }}
        permissions:
            id-token: write # required for trusted publishing

        steps:
            - uses: actions/checkout@v4

            - name: Install uv
              uses: astral-sh/setup-uv@v5

            - name: Build package
              run: uv build

            - name: Publish to TestPyPI (manual test run)
              if: github.event_name == 'workflow_dispatch'
              # --check-url lets the same version be re-tested repeatedly
              # without bumping it, by skipping a re-upload of a file already
              # on TestPyPI instead of failing.
              run: uv publish --publish-url https://test.pypi.org/legacy/ --check-url https://test.pypi.org/simple/

            - name: Publish to PyPI
              if: github.event_name == 'release'
              run: uv publish
