[project]
name = "PyNerva"
version = "0.0.9"
description = "Framework for exploring advanced program synthesis and transformation techniques"
authors = [{ name = "Kris Kwiatkowski", email = "kris@amongbytes.com" }]
keywords = [
    "assembly",
    "codegen",
    "x86-64",
    "arm",
    "risc-v",
    "elf",
    "assembler",
    "program synthesis",
    "code transformation",
]
readme = "README.rst"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: POSIX :: BSD :: FreeBSD",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Assembly",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Natural Language :: English",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development",
    "Topic :: Software Development :: Assemblers",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["click>=8.1.8", "requests>=2.34.2"]

[project.urls]
Homepage = "https://github.com/kriskwiatkowski/NervaPy.git"

[build-system]
requires = ["hatchling", "Opcodes>=0.3.13"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nervapy"]

[tool.mypy]
[[tool.mypy.overrides]]
module = "dynacl"
ignore_missing_imports = true

[tool.isort]
# Without this, isort's default import-wrapping style disagrees with
# black's, so running one after the other undoes the other's changes.
# "black" profile makes isort produce output black already accepts.
profile = "black"

[tool.bandit]
# B101 (assert_used): this codebase uses `assert` throughout as internal
# precondition/invariant checks on its own API (e.g. argument type checks in
# an assembler DSL), not as a security gate on untrusted external input, so
# the "asserts are stripped under python -O" concern bandit flags doesn't
# apply here. Suppressed project-wide rather than rewritten at ~290 call
# sites across the codebase.
skips = ["B101"]
